<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun-Dried | Premium Snacks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .card { 
            width: 900px; max-width: 95vw; height: 550px; 
            background-color: #2d4a22; 
            border-radius: 30px; padding: 40px; 
            display: flex; flex-direction: column; position: relative; 
            box-shadow: 0 40px 80px rgba(0,0,0,0.3); 
            transition: background-color 0.8s; 
            overflow: hidden; /* Card ke bahar kuch bhi nahi niklega */
        }
        
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; z-index: 20; }
        .logo { font-weight: 700; font-size: 1.2rem; color: #fff; }
        .logo span { color: #F4A261; }
        
        .content { display: flex; flex: 1; position: relative; }
        .info-box { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-right: 20px; color: #fff; position: relative; z-index: 20; }
        .info-box h1 { font-family: 'Playfair Display', serif; font-size: 3rem; line-height: 1.1; margin-bottom: 10px; }
        .price-row { font-size: 0.9rem; color: rgba(255,255,255,0.7); margin-bottom: 15px; }
        .price-row strong { color: #fff; font-size: 1.1rem; margin-right: 8px; }
        .info-box p { font-size: 0.9rem; color: rgba(255,255,255,0.8); line-height: 1.6; margin-bottom: 20px; max-width: 280px; }
        .tags { display: flex; gap: 10px; }
        .tag { background: rgba(255,255,255,0.15); color: #fff; padding: 5px 12px; border-radius: 12px; font-size: 0.75rem; }
        
        .visuals { flex: 1.2; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* BACKGROUND TEXT: Ab bilkul fit aur centered rahega, kabhi bahar nahi jayega */
        .bg-text { 
            position: absolute; 
            font-family: 'Playfair Display', serif; 
            font-size: 7rem; /* Size chota kar diya hai taake fit aaye */
            font-weight: 800; 
            color: #F4A261; 
            opacity: 0.2; 
            z-index: 1; 
            letter-spacing: -2px; 
            white-space: nowrap;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%); /* Bilkul center mein lock */
        }
        
        .packet { 
            width: 260px; height: auto; 
            z-index: 10; position: relative; 
            filter: drop-shadow(0 25px 35px rgba(0,0,0,0.5)); 
            display: block;
            animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        .fruit { 
            position: absolute; z-index: 11; 
            width: 100px; height: auto; 
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.4)); 
            display: block;
            animation: fruitPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, float 3s ease-in-out infinite;
        }
        .f1 { top: 15%; left: 15%; width: 110px; animation-delay: 0s, 0.6s; }
        .f2 { bottom: 15%; right: 15%; width: 120px; animation-delay: 0.1s, 0.7s; }
        .f3 { top: 25%; right: 10%; width: 80px; animation-delay: 0.2s, 0.8s; }

        .right-controls { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; z-index: 20; }
        .dot { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; justify-content: center; align-items: center; font-size: 0.7rem; font-weight: 600; color: #fff; cursor: pointer; }
        .dot.active { background: #fff; color: #000; }
        
        .bottom-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; position: relative; z-index: 20; }
        .arrows { display: flex; gap: 12px; }
        .arrow-btn { width: 40px; height: 40px; border-radius: 50%; background: #F4A261; border: none; color: #000; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .bottom-price { font-size: 1.8rem; font-weight: 700; color: #fff; }
        .cart-area { display: flex; align-items: center; gap: 15px; }
        .thumbs { display: flex; gap: 10px; }
        .thumb { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.15); border: 2px solid transparent; cursor: pointer; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .thumb.active { border-color: #F4A261; }
        .add-btn { background: #F4A261; color: #000; border: none; padding: 12px 28px; border-radius: 25px; font-weight: 700; font-size: 0.9rem; cursor: pointer; }

        @keyframes popIn {
            0% { transform: translateY(50px) scale(0.9); opacity: 0; }
            60% { transform: translateY(-10px) scale(1.02); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes fruitPop {
            0% { transform: scale(0) translateY(20px); opacity: 0; }
            70% { transform: scale(1.2) translateY(-5px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <div class="top-bar">
            <div class="logo"><span>sun-dried</span></div>
        </div>
        <div class="content">
            <div class="info-box">
                <h1 id="title">Olive<br>Snack</h1>
                <div class="price-row"><strong>$79.50</strong> <del>$89.50</del></div>
                <p id="desc">Experience the perfect blend of rich, sun-kissed flavors in every bite.</p>
                <div class="tags"><span class="tag">Sugar Free</span><span class="tag">Vegan</span></div>
            </div>
            <div class="visuals">
                <div class="bg-text" id="bgText">Olive</div>
                
                <!-- Packets aur Fruits dono ke liye .png confirm kar diya hai -->
                <img src="olive-packet.png" class="packet" id="packet" alt="Olive Packet">
                <img src="olive.png" class="fruit f1" alt="Olive Fruit">
                <img src="olive.png" class="fruit f2" alt="Olive Fruit">
                <img src="olive.png" class="fruit f3" alt="Olive Fruit">
            </div>
            <div class="right-controls">
                <div class="dot active">600</div><div class="dot">250</div><div class="dot">100</div>
            </div>
        </div>
        <div class="bottom-bar">
            <div class="arrows">
                <button class="arrow-btn" id="prevBtn">◀</button>
                <button class="arrow-btn" id="nextBtn">▶</button>
            </div>
            <div class="bottom-price">$79.50</div>
            <div class="cart-area">
                <div class="thumbs">
                    <div class="thumb active"><img src="olive.png" alt="thumb"></div>
                    <div class="thumb"><img src="olive.png" alt="thumb"></div>
                </div>
                <button class="add-btn">Add to cart</button>
            </div>
        </div>
    </div>
    <script>
        const slides = [
            { name: 'Olive', cardColor: '#2d4a22', accent: '#F4A261', desc: 'Experience the perfect blend of rich, sun-kissed flavors in every bite.', packet: 'olive-packet.png', fruit: 'olive.png' },
            { name: 'Mango', cardColor: '#8a6d1c', accent: '#FFD54F', desc: 'Tropical sweetness captured in every bite. 100% natural and chewy.', packet: 'mango-packet.png', fruit: 'mango.png' },
            { name: 'Cherry', cardColor: '#5c0a0a', accent: '#FF8A65', desc: 'Tart, sweet, and incredibly satisfying. Premium sun-dried cherries.', packet: 'cherry-packet.png', fruit: 'cherry.png' }
        ];
        let i = 0;
        const title = document.getElementById('title');
        const desc = document.getElementById('desc');
        const bgText = document.getElementById('bgText');
        const packet = document.getElementById('packet');
        const card = document.getElementById('mainCard');
        const fruits = document.querySelectorAll('.fruit');
        const thumbs = document.querySelectorAll('.thumb img');
        const activeThumb = document.querySelectorAll('.thumb');

        function update() {
            const s = slides[i];
            card.style.backgroundColor = s.cardColor; 
            document.querySelector('.logo span').style.color = s.accent;
            document.querySelectorAll('.arrow-btn, .add-btn').forEach(b => b.style.background = s.accent);
            activeThumb.forEach(t => t.style.borderColor = s.accent);
            bgText.style.color = s.accent;
            title.innerHTML = s.name + '<br>Snack';
            desc.textContent = s.desc;
            bgText.textContent = s.name;
            
            packet.style.animation = 'none';
            packet.offsetHeight; 
            packet.style.animation = 'popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
            
            fruits.forEach((f, idx) => {
                f.style.animation = 'none';
                f.offsetHeight;
                f.style.animation = `fruitPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) ${idx * 0.1}s forwards, float 3s ease-in-out ${0.6 + idx * 0.1}s infinite`;
            });
            
            packet.src = s.packet;
            fruits.forEach(f => f.src = s.fruit);
            thumbs.forEach(t => t.src = s.fruit);
        }
        document.getElementById('nextBtn').onclick = () => { i = (i + 1) % slides.length; update(); };
        document.getElementById('prevBtn').onclick = () => { i = (i - 1 + slides.length) % slides.length; update(); };
    </script>
</body>
</html>
